{% extends 'base.html' %}

{% block content %}
<section class="py-5">
    <div class="container">
        <div class="row mb-5 align-items-center">
            <div class="col-md-6">
                <h2 class="display-6" style="font-family: 'Playfair Display', serif;">The Collection</h2>
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb mb-0" style="font-size: 0.8rem; letter-spacing: 1px;">
                        <li class="breadcrumb-item"><a href="/" class="text-decoration-none text-muted">HOME</a></li>
                        <li class="breadcrumb-item active text-uppercase" aria-current="page" style="color: #B5838D;">All Art</li>
                    </ol>
                </nav>
            </div>
            <div class="col-md-6 text-md-end mt-3 mt-md-0">
                <p class="text-muted small">Showing {{ products|length }} unique handcrafted pieces</p>
            </div>
        </div>

        <div class="row g-4">
            {% for product in products %}
            <div class="col-6 col-md-4 col-lg-3">
                <div class="product-card">
                    <a href="/product/{{product.id}}/" class="text-decoration-none">
                        <div class="product-img-wrapper">
                            <img src="{{ product.image.url }}" class="img-fluid" alt="{{ product.name }}">
                            <div class="product-overlay">
                                <span class="view-text">VIEW DETAILS</span>
                            </div>
                        </div>
                        <div class="product-info text-center pt-3">
                            <h5 class="product-title mb-1">{{ product.name }}</h5>
                            <p class="product-price">₹{{ product.price }}</p>
                        </div>
                    </a>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</section>

<style>
    /* Clean Grid Styling */
    .product-card {
        margin-bottom: 2rem;
        transition: all 0.3s ease;
    }

    .product-img-wrapper {
        position: relative;
        overflow: hidden;
        background-color: #FAF7F2; /* Soft background while loading */
        aspect-ratio: 4 / 5; /* Keeps all images uniform */
    }

    .product-img-wrapper img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 0.8s cubic-bezier(0.2, 1, 0.3, 1);
    }

    /* Overlay Effect */
    .product-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(255, 255, 255, 0.2);
        backdrop-filter: blur(2px);
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        transition: opacity 0.4s ease;
    }

    .view-text {
        color: #3D3D3D;
        background: white;
        padding: 10px 20px;
        font-size: 0.75rem;
        letter-spacing: 2px;
        font-weight: 500;
        box-shadow: 0 5px 15px rgba(0,0,0,0.05);
    }

    /* Hover States */
    .product-card:hover .product-img-wrapper img {
        transform: scale(1.08);
    }

    .product-card:hover .product-overlay {
        opacity: 1;
    }

    /* Typography */
    .product-title {
        font-family: 'Playfair Display', serif;
        font-size: 1.1rem;
        color: #3D3D3D;
        font-weight: 400;
        letter-spacing: 0.5px;
    }

    .product-price {
        font-size: 0.9rem;
        color: #B5838D;
        font-weight: 500;
    }

    .breadcrumb-item + .breadcrumb-item::before {
        content: "•";
        color: #dee2e6;
    }

    /* Responsive adjustments */
    @media (max-width: 576px) {
        .product-title { font-size: 0.95rem; }
        .view-text { display: none; } /* Hide overlay button on mobile for better tap UX */
    }
</style>
{% endblock %}
